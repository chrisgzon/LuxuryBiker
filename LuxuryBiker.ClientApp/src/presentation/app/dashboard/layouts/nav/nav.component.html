<!-- partial:../../partials/_navbar.html -->
<div class="text-center navbar-brand-wrapper d-flex align-items-center justify-content-center">
  <a class="navbar-brand brand-logo" [routerLink]="['/home']"><img src="assets/melody/images/logo.svg"
      alt="logo" /></a>
  <a class="navbar-brand brand-logo-mini" [routerLink]="['/home']"><img src="assets/melody/images/logo-mini.svg"
      alt="logo" /></a>
</div>
<div class="navbar-menu-wrapper d-flex align-items-stretch">
  <button class="navbar-toggler navbar-toggler align-self-center" type="button" data-toggle="minimize">
    <span class="fas fa-bars"></span>
  </button>
  <ul class="navbar-nav navbar-nav-right">
    <li class="nav-item dropdown d-none d-lg-flex">
      <div class="nav-link">
        <span class="dropdown-toggle btn btn-outline-dark" id="languageDropdown" data-toggle="dropdown">{{ 'common.language' | translate }}</span>
        <div class="dropdown-menu navbar-dropdown" aria-labelledby="languageDropdown">
          <a class="dropdown-item font-weight-medium" (click)="onLanguageChange('en')">
            English
          </a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item font-weight-medium" (click)="onLanguageChange('es')">
            Español
          </a>
        </div>
      </div>
    </li>
    <li class="nav-item nav-profile dropdown">
      <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown" id="profileDropdown">
        <img src="assets/melody/images/faces/face5.jpg" alt="profile" />
      </a>
      <div class="dropdown-menu dropdown-menu-right navbar-dropdown" aria-labelledby="profileDropdown">
        <div class="dropdown-divider"></div>
        <a class="dropdown-item" (click)="logout()">
          <i class="fas fa-power-off text-primary"></i>
          {{ 'common.logout' | translate }}
        </a>
      </div>
    </li>
  </ul>
  <button class="navbar-toggler navbar-toggler-right d-lg-none align-self-center" type="button" data-toggle="offcanvas">
    <span class="fas fa-bars"></span>
  </button>
</div>
<!-- partial -->
