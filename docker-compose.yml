services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: luxurybiker-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-LuxuryBiker_2024!}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - luxurybiker-sqldata:/var/opt/mssql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  luxurybiker-sqldata:
