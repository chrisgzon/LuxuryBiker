name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LuxuryBiker.Backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LuxuryBiker.Backend.sln

      - name: Build
        run: dotnet build LuxuryBiker.Backend.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LuxuryBiker.Backend.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LuxuryBiker.ClientApp
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: LuxuryBiker.ClientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
